[package]
name = "ll-model"
version = "0.1.0"
edition = "2024"
description = "Limelight runtime data model: classes, memory manager, GC"

[lib]
# rlib for Rust consumers and tests, staticlib for the C++/LLVM layer.
# Neither is how the hot paths reach compiled PHP code: the crate is also
# emitted as LLVM bitcode and merged with compiler-generated IR, so
# retain/release, bump allocation and the COW checks inline across the
# boundary. How: README.md, "LLVM IR export". Why:
# rfc/runtime/implementation-language.md.
crate-type = ["rlib", "staticlib"]

[features]
# rc-walk is the primary GC strategy and the default build
# (decision 2026-07-27, dev/DECISIONS.md). The rc-trace configuration
# is selected with --no-default-features.
default = ["rc-walk"]

# Counters read by the bench-external probes (`walk_probe.cpp`,
# `churn_probe.cpp`) via `ll_probe_counters`. Off by default: each one is a
# store on the allocation hot path, which is exactly what those probes are
# there to measure. Build with `--features probe-counters` for them, never
# for a timing run.
probe-counters = []

# Saturate the reference count instead of letting it wrap. Off by
# default: `refcount` is a `u32`, so wrapping needs four billion live
# references — at least 32 GB of pointers just to hold them — which no
# legitimate program reaches. The real risk is a defect in generated code
# or FFI calling retain without a matching store, and that is what this
# is for. Costs one compare and one never-taken branch per retain
# (measured in IR: 22 -> 26 lines), on the most frequent operation in the
# runtime, which is why it is a choice rather than a default. When it
# fires the object becomes permanently immortal — a leak, chosen over
# freeing an object that is still referenced.
checked-refcount = []

# Select the rc-walk concurrent cycle collector instead of rc-trace
# (`rfc/model/gc/rc-walk.md`). Strategy selection is build-time by design
# (`rfc/model/gc/strategies.md`): the two collectors claim the same top
# half of the header flags word — rc-trace stores its candidate index in
# bits 15-31, rc-walk its epoch byte (16-23) and condemned byte (24-31) —
# and rc-walk's collector writes both bytes from its own thread, which
# would corrupt a live candidate index. With this feature on, the
# candidate buffer is never fed and header accesses compile as relaxed
# atomics (another thread — the collector — reads them). Since the
# narrow-mutator amendment (2026-07-27) the mutator's hot paths do not
# touch the condemned byte at all; the collision is the collector's
# writes, not the mutator's.
rc-walk = []

# Compile the event journal's record sites into the runtime
# (`dev/design/debug-modes.md` §9.6). Off by default, and off means the
# sites are not there at all rather than switched off at run time: the
# sites sit on the allocation and death paths, where a runtime check is
# itself the cost being measured. The journal module is in every build
# regardless — what this gates is the calls into it.
#
# On, and every default kind still costs one relaxed load of the enabled
# mask and one predictable branch per site, which is **not** claimed to be
# free: the two-arm measurement is owed before this is turned on anywhere
# but a development build (`dev/BENCHMARKS.md`).
debug-journal = []

# The compiler folds the hash of every literal key into the program, and
# the seed is therefore fixed at build time from `LL_HASH_SEED` rather than
# drawn from the OS per process. The two halves are one option because a
# compiler that folds has to know the seed while it compiles, and a
# per-process seed is not knowable then.
#
# Off by default, and the default is the safe one: with a per-process seed
# an attacker holding the artifact cannot compute a set of colliding keys
# in advance, which with folding on they can. What folding buys is one load
# per literal-key access — a literal's hash is already computed once per
# process at intern time — and that has not been measured. See
# `src/hash/seed.rs` and `rfc/model/strings.md`.
#
# A folding build must also check `ll_hash_stamp_matches` at startup:
# folded constants live in the program and the function that has to agree
# with them lives in the runtime, and a mismatch is silent otherwise.
hash-folding = []

[lints.rust]
# `loom` is a build-time selector rather than a feature: the model it gates
# (`src/array/version_bracket_model.rs`) replaces the standard atomics with
# loom's own, which no ordinary build may link.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]

[dev-dependencies]
criterion = "0.5"
bumpalo = "3"

# Bench-only, and it builds C: `libmimalloc-sys` shells out to a C compiler
# for the *target*. Miri runs the test suite against a UNIX target (the
# Windows TLS path is inline `asm!`, which Miri cannot execute), and no
# Linux C toolchain exists on a Windows dev box — so building this under
# Miri fails before a single test runs. Nothing outside `benches/` uses it.
# Only under `RUSTFLAGS="--cfg loom"`, so an ordinary build never resolves
# it: the model in `src/array/version_bracket_model.rs` is the sole user.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[target.'cfg(not(miri))'.dev-dependencies]
mimalloc = "0.1"
# jemalloc (tikv-jemallocator) intentionally omitted: jemalloc-sys does
# not build on the x86_64-pc-windows-msvc toolchain (autotools configure
# fails). mimalloc is the primary rival regardless.

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "barrier"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "standard"
harness = false

[[bench]]
name = "strings"
harness = false

[profile.release]
# One codegen unit -> one clean LLVM module per crate for IR export
codegen-units = 1
panic = "abort"
