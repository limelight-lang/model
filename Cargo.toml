[package]
name = "ll-model"
version = "0.1.0"
edition = "2024"
description = "Limelight runtime data model: classes, memory manager, GC"

[lib]
# rlib for Rust consumers and tests, staticlib for the C++/LLVM layer
crate-type = ["rlib", "staticlib"]

[features]
# Counters read by the bench-external probes (`walk_probe.cpp`,
# `churn_probe.cpp`) via `ll_probe_counters`. Off by default: each one is a
# store on the allocation hot path, which is exactly what those probes are
# there to measure. Build with `--features probe-counters` for them, never
# for a timing run.
probe-counters = []

[dependencies]

[dev-dependencies]
criterion = "0.5"
bumpalo = "3"
mimalloc = "0.1"
# jemalloc (tikv-jemallocator) intentionally omitted: jemalloc-sys does
# not build on the x86_64-pc-windows-msvc toolchain (autotools configure
# fails). mimalloc is the primary rival regardless.

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "standard"
harness = false

[profile.release]
# One codegen unit -> one clean LLVM module per crate for IR export
codegen-units = 1
panic = "abort"
