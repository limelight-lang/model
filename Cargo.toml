[package]
name = "ll-model"
version = "0.1.0"
edition = "2024"
description = "Limelight runtime data model: classes, memory manager, GC"

[lib]
# rlib for Rust consumers and tests, staticlib for the C++/LLVM layer
crate-type = ["rlib", "staticlib"]

[features]
# rc-walk is the primary GC strategy and the default build
# (decision 2026-07-27, dev/DECISIONS.md). The rc-trace configuration
# is selected with --no-default-features.
default = ["rc-walk"]

# Counters read by the bench-external probes (`walk_probe.cpp`,
# `churn_probe.cpp`) via `ll_probe_counters`. Off by default: each one is a
# store on the allocation hot path, which is exactly what those probes are
# there to measure. Build with `--features probe-counters` for them, never
# for a timing run.
probe-counters = []

# Saturate the reference count instead of letting it wrap. Off by
# default: `refcount` is a `u32`, so wrapping needs four billion live
# references — at least 32 GB of pointers just to hold them — which no
# legitimate program reaches. The real risk is a defect in generated code
# or FFI calling retain without a matching store, and that is what this
# is for. Costs one compare and one never-taken branch per retain
# (measured in IR: 22 -> 26 lines), on the most frequent operation in the
# runtime, which is why it is a choice rather than a default. When it
# fires the object becomes permanently immortal — a leak, chosen over
# freeing an object that is still referenced.
checked-refcount = []

# Select the rc-walk concurrent cycle collector instead of rc-trace
# (`rfc/model/gc/rc-walk.md`). Strategy selection is build-time by design
# (`rfc/model/gc/strategies.md`): the two collectors claim the same top
# half of the header flags word — rc-trace stores its candidate index in
# bits 15-31, rc-walk its epoch byte (16-23) and condemned byte (24-31) —
# and rc-walk's collector writes both bytes from its own thread, which
# would corrupt a live candidate index. With this feature on, the
# candidate buffer is never fed and header accesses compile as relaxed
# atomics (another thread — the collector — reads them). Since the
# narrow-mutator amendment (2026-07-27) the mutator's hot paths do not
# touch the condemned byte at all; the collision is the collector's
# writes, not the mutator's.
rc-walk = []

[dependencies]

[dev-dependencies]
criterion = "0.5"
bumpalo = "3"

# Bench-only, and it builds C: `libmimalloc-sys` shells out to a C compiler
# for the *target*. Miri runs the test suite against a UNIX target (the
# Windows TLS path is inline `asm!`, which Miri cannot execute), and no
# Linux C toolchain exists on a Windows dev box — so building this under
# Miri fails before a single test runs. Nothing outside `benches/` uses it.
[target.'cfg(not(miri))'.dev-dependencies]
mimalloc = "0.1"
# jemalloc (tikv-jemallocator) intentionally omitted: jemalloc-sys does
# not build on the x86_64-pc-windows-msvc toolchain (autotools configure
# fails). mimalloc is the primary rival regardless.

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "standard"
harness = false

[profile.release]
# One codegen unit -> one clean LLVM module per crate for IR export
codegen-units = 1
panic = "abort"
